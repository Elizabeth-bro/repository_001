name: Sentry Release Workflow

# Сценарий будет запускаться автоматически каждый раз, когда вы публикуете новый релиз в GitHub
on:
  release:
    types: [published]

jobs:
  deploy-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем код вашего репозитория на виртуальную машину GitHub
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важно, чтобы Sentry смог прочитать историю коммитов

      # 2. Ваш блок: создание релиза в Sentry
      - name: Create Sentry Release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.name: Sentry Release Workflow

